<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LeetCode Clone</h1>
        </header>
        <main>
            <section class="problem-description">
                <h2>Problem Title</h2>
                <p>Problem description goes here.  This includes the problem statement, input/output examples, and constraints.</p>
            </section>
            <section class="editor-section">
                <div class="editor-header">
                    <button class="language-select">JavaScript</button>
                </div>
                <div class="editor-container">
                    <textarea id="editor"></textarea>
                </div>
                <div class="editor-footer">
                    <button class="run-code">Run Code</button>
                    <button class="submit-code">Submit</button>
                </div>
            </section>
            <section class="results-section">
                <h3>Results:</h3>
                <div id="results"></div>
            </section>
        </main>
        <footer>
            <p>&copy; 2024 LeetCode Clone</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
